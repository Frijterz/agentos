# agentos Hyprland config. LIVE FILE: save and Hyprland reloads it, no rebuild needed.
# Sourced after the Home Manager-generated config, so settings here win over
# Stylix's. Border colours are left to Stylix so they follow the theme.
# Check for mistakes with: hyprctl configerrors

# ── Display ──────────────────────────────────────────────────────────────────
# Samsung 1920×1200 OLED, 60 Hz (UM3406KA panel, read from EDID).
# Scale 1.25 → 1536×960 of workspace. Try 1 for more space; this file is live.
monitor = eDP-1, 1920x1200@60, 0x0, 1.25
monitor = , preferred, auto, 1

xwayland {
    force_zero_scaling = true
}

# Quickshell (also the polkit agent and notification daemon) and hypridle start as systemd user services,
# so there are no exec-once lines here.

# ── Look & feel ──────────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.18
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, snappy, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = border, 1, 8, smooth
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, smooth, slide
    animation = workspaces, 1, 5, smooth, slidefade 15%
    animation = specialWorkspace, 1, 5, smooth, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # The internal panel is fixed 60 Hz; VRR only matters for external monitors,
    # and then only fullscreen (VRR on the desktop can flicker on OLED).
    vrr = 2
    focus_on_activate = true
}

# Frosted glass behind the Quickshell bar and Claude panel (Hyprland 0.53+ syntax).
# ignore_alpha 0: only blur where the shell actually draws, not its transparent margins.
layerrule = match:namespace agentos-bar, blur on, ignore_alpha 0
layerrule = match:namespace agentos-claude, blur on, ignore_alpha 0
layerrule = match:namespace agentos-osd, blur on, ignore_alpha 0
# 0.5: blur the card (alpha 0.72) but not the dimmed backdrop (0.35) around it.
layerrule = match:namespace agentos-cheatsheet, blur on, ignore_alpha 0.5
layerrule = match:namespace agentos-overview, blur on, ignore_alpha 0
layerrule = match:namespace agentos-polkit, blur on, ignore_alpha 0.5
layerrule = match:namespace agentos-system, blur on, ignore_alpha 0.5
layerrule = match:namespace agentos-launcher, blur on, ignore_alpha 0.5
layerrule = match:namespace agentos-toasts, blur on, ignore_alpha 0.5
# fuzzel (the Super+P password menu) calls its layer "launcher".
layerrule = match:namespace launcher, blur on, ignore_alpha 0.5


# ── Input ────────────────────────────────────────────────────────────────────
input {
    # US layout with AltGr accents (AltGr+e = é) and no dead keys: handy for Dutch + code.
    kb_layout = us
    kb_variant = altgr-intl
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# Three-finger swipe between workspaces.
gesture = 3, horizontal, workspace

# ── Keybinds ─────────────────────────────────────────────────────────────────
$mod = SUPER
$term = ghostty

# bindd = mods, key, "Group: description", dispatcher, args. The cheat sheet (Super+/)
# reads these live from hyprctl; binds with the same description merge into one row.
bindd = $mod, SLASH, Help: Show this cheat sheet, exec, qs ipc call cheatsheet toggle
# Herdr runs inside the terminal and keeps agent sessions alive; `herdr` attaches to
# the running session or starts it. Detach with Ctrl+b then q.
bindd = $mod, RETURN, Apps: Terminal with Herdr (agent sessions), exec, uwsm app -- $term -e herdr
bindd = $mod SHIFT, RETURN, Apps: Plain terminal, exec, uwsm app -- $term
bindd = $mod, SPACE, Apps: App launcher (=calc · else ask Claude), exec, qs ipc call launcher toggle
bindd = $mod, A, Apps: Ask Claude, exec, qs ipc call claude toggle
# Bitwarden via rofi-rbw (home/apps.nix): type into the focused app, or copy (cleared after 20 s).
# Pressed again while the menu is open: close it (as Super+Space does for the launcher).
bindd = $mod, P, Apps: Password: type into the focused app, exec, pkill -x fuzzel || rofi-rbw --action type --target password
bindd = $mod SHIFT, P, Apps: Password: copy (cleared after 20 s), exec, pkill -x fuzzel || rofi-rbw --action copy --target password
bindd = $mod, B, Apps: Chromium, exec, uwsm app -- chromium
bindd = $mod, TAB, Workspaces: Overview (click / drag / arrows), exec, qs ipc call overview toggle
bindd = $mod, grave, Workspaces: Previous workspace, workspace, previous

bindd = $mod, Q, Windows: Close window, killactive
bindd = $mod, F, Windows: Fullscreen, fullscreen, 0
bindd = $mod, T, Windows: Float / tile, togglefloating
bindd = $mod, J, Windows: Flip split direction, layoutmsg, togglesplit

bindd = $mod, Escape, System: System menu (Wi-Fi / Bluetooth / sound / power), exec, qs ipc call system toggle
bindd = $mod, M, System: Next mode (normal / battery / presentation / focus), exec, agentos-mode next
bindd = $mod CTRL, L, System: Lock screen, exec, loginctl lock-session
bindd = $mod SHIFT, E, System: Log out, exec, uwsm stop
bindd = $mod SHIFT, S, Tools: Screenshot area to clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = $mod SHIFT, C, Tools: Pick colour to clipboard, exec, hyprpicker -a

bindd = $mod, left, Windows: Focus window in direction, movefocus, l
bindd = $mod, right, Windows: Focus window in direction, movefocus, r
bindd = $mod, up, Windows: Focus window in direction, movefocus, u
bindd = $mod, down, Windows: Focus window in direction, movefocus, d
bindd = $mod SHIFT, left, Windows: Move window in direction, movewindow, l
bindd = $mod SHIFT, right, Windows: Move window in direction, movewindow, r
bindd = $mod SHIFT, up, Windows: Move window in direction, movewindow, u
bindd = $mod SHIFT, down, Windows: Move window in direction, movewindow, d

# Resize (hold to repeat). Tiled windows move the split; floating ones change size.
bindde = $mod, equal, Windows: Bigger, resizeactive, 40 40
bindde = $mod, minus, Windows: Smaller, resizeactive, -40 -40
bindde = $mod CTRL, right, Windows: Resize: wider / narrower / taller / shorter, resizeactive, 40 0
bindde = $mod CTRL, left, Windows: Resize: wider / narrower / taller / shorter, resizeactive, -40 0
bindde = $mod CTRL, down, Windows: Resize: wider / narrower / taller / shorter, resizeactive, 0 40
bindde = $mod CTRL, up, Windows: Resize: wider / narrower / taller / shorter, resizeactive, 0 -40

# Snap to a screen half (floats the window; Super+T tiles it again). See snap.sh.
bindd = $mod ALT, left, Windows: Snap to left / right / upper / lower half, exec, bash ~/agentos/config/hypr/snap.sh left
bindd = $mod ALT, right, Windows: Snap to left / right / upper / lower half, exec, bash ~/agentos/config/hypr/snap.sh right
bindd = $mod ALT, up, Windows: Snap to left / right / upper / lower half, exec, bash ~/agentos/config/hypr/snap.sh up
bindd = $mod ALT, down, Windows: Snap to left / right / upper / lower half, exec, bash ~/agentos/config/hypr/snap.sh down

bindd = $mod, 1, Workspaces: Go to workspace, workspace, 1
bindd = $mod, 2, Workspaces: Go to workspace, workspace, 2
bindd = $mod, 3, Workspaces: Go to workspace, workspace, 3
bindd = $mod, 4, Workspaces: Go to workspace, workspace, 4
bindd = $mod, 5, Workspaces: Go to workspace, workspace, 5
bindd = $mod, 6, Workspaces: Go to workspace, workspace, 6
bindd = $mod, 7, Workspaces: Go to workspace, workspace, 7
bindd = $mod, 8, Workspaces: Go to workspace, workspace, 8
bindd = $mod, 9, Workspaces: Go to workspace, workspace, 9
bindd = $mod SHIFT, 1, Workspaces: Send window to workspace, movetoworkspace, 1
bindd = $mod SHIFT, 2, Workspaces: Send window to workspace, movetoworkspace, 2
bindd = $mod SHIFT, 3, Workspaces: Send window to workspace, movetoworkspace, 3
bindd = $mod SHIFT, 4, Workspaces: Send window to workspace, movetoworkspace, 4
bindd = $mod SHIFT, 5, Workspaces: Send window to workspace, movetoworkspace, 5
bindd = $mod SHIFT, 6, Workspaces: Send window to workspace, movetoworkspace, 6
bindd = $mod SHIFT, 7, Workspaces: Send window to workspace, movetoworkspace, 7
bindd = $mod SHIFT, 8, Workspaces: Send window to workspace, movetoworkspace, 8
bindd = $mod SHIFT, 9, Workspaces: Send window to workspace, movetoworkspace, 9

bindd = $mod, S, Workspaces: Show / hide scratchpad, togglespecialworkspace, scratch
bindd = $mod ALT, S, Workspaces: Send window to scratchpad, movetoworkspace, special:scratch

bindmd = $mod, mouse:272, Mouse: Drag window, movewindow
bindmd = $mod, mouse:273, Mouse: Resize window, resizewindow

# Hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && qs ipc call osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
