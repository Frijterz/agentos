# agentos Hyprland config. LIVE FILE: save and Hyprland reloads it, no rebuild needed.
# Sourced after the Home Manager-generated config, so settings here win over
# Stylix's. Border colours are left to Stylix so they follow the theme.
# Check for mistakes with: hyprctl configerrors

# ── Display ──────────────────────────────────────────────────────────────────
# Samsung 1920×1200 OLED, 60 Hz (UM3406KA panel, read from EDID).
# Scale 1.25 → 1536×960 of workspace. Try 1 for more space; this file is live.
monitor = eDP-1, 1920x1200@60, 0x0, 1.25
monitor = , preferred, auto, 1

xwayland {
    force_zero_scaling = true
}

# Quickshell, mako, hypridle and the polkit agent start as systemd user services,
# so there are no exec-once lines here.

# ── Look & feel ──────────────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.18
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = snappy, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, snappy, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = border, 1, 8, smooth
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, smooth, slide
    animation = workspaces, 1, 5, smooth, slidefade 15%
    animation = specialWorkspace, 1, 5, smooth, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # The internal panel is fixed 60 Hz; VRR only matters for external monitors,
    # and then only fullscreen (VRR on the desktop can flicker on OLED).
    vrr = 2
    focus_on_activate = true
}

# Frosted glass behind the Quickshell bar and Claude panel (Hyprland 0.53+ syntax).
# ignore_alpha 0: only blur where the shell actually draws, not its transparent margins.
layerrule = match:namespace agentos-bar, blur on, ignore_alpha 0
layerrule = match:namespace agentos-claude, blur on, ignore_alpha 0
layerrule = match:namespace agentos-osd, blur on, ignore_alpha 0


# ── Input ────────────────────────────────────────────────────────────────────
input {
    # US layout with AltGr accents (AltGr+e = é) and no dead keys: handy for Dutch + code.
    kb_layout = us
    kb_variant = altgr-intl
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# Three-finger swipe between workspaces.
gesture = 3, horizontal, workspace

# ── Keybinds ─────────────────────────────────────────────────────────────────
$mod = SUPER
$term = ghostty

bind = $mod, RETURN, exec, uwsm app -- $term
bind = $mod, SPACE, exec, fuzzel --launch-prefix="uwsm app -- "
bind = $mod, A, exec, qs ipc call claude toggle
bind = $mod, B, exec, uwsm app -- firefox
# TODO: Quickshell workspace overview. Until then, jump back and forth.
bind = $mod, TAB, workspace, previous

bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating
bind = $mod, J, layoutmsg, togglesplit

bind = $mod CTRL, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, uwsm stop
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, C, exec, hyprpicker -a

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, S, togglespecialworkspace, scratch
bind = $mod ALT, S, movetoworkspace, special:scratch

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && qs ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && qs ipc call osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
